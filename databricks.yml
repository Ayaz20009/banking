# FE Bar: Acceptance Risk Control for Network Migration
# Deploy: databricks bundle validate --strict --profile febar
#         databricks bundle deploy --profile febar
bundle:
  name: febar

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all objects
    default: classic_stable_zjnu75_catalog
  schema:
    description: Schema for all tables, volumes and functions
    default: network_migration
  warehouse_id:
    description: Serverless SQL warehouse (Serverless Starter Warehouse)
    default: 34e45919b39491cf
  llm_endpoint:
    description: Foundation model endpoint for ai_query explanations (json_schema structured output + temperature verified 2026-11-23)
    default: databricks-claude-sonnet-4-6
  judge_endpoint:
    description: Judge model for MLflow GenAI evaluation (different model family from the generator)
    default: databricks-gpt-5-4
  lakebase_project:
    description: Lakebase Autoscaling project for the case store
    default: febar-ops
  genie_space_id:
    description: Genie space created by tools/create_genie.py (src/genie/space_id.txt)
    default: 01f1e710e2f1183284ccb47bc5215473
  lakebase_branch:
    description: Lakebase Autoscaling branch for the case store
    default: projects/febar-ops/branches/production
  lakebase_database:
    description: Lakebase database resource
    default: projects/febar-ops/branches/production/databases/databricks-postgres
  app_name:
    description: "App name: lowercase letters, digits and hyphens; max 30 characters"
    default: febar-ops-app

targets:
  dev:
    default: true
    # Not using `mode: development` on purpose: it would prefix the schema name
    # (dev_<user>_network_migration) and break the agreed UC namespace.
    workspace:
      host: https://fevm-classic-stable-zjnu75.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
