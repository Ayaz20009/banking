resources:
  jobs:
    febar_main:
      name: febar_main
      description: "End-to-end: T0 governance -> T1 pipeline -> T1b tags -> T2 flag + explain (case representatives) -> T3 cases into Lakebase -> T4 cases back to UC -> T5 readiness -> T6 evidence snapshot. Starts when a complete data drop lands."
      max_concurrent_runs: 1
      queue:
        enabled: true          # overlapping triggers wait instead of being skipped
      trigger:
        pause_status: PAUSED   # decision 2026-11-23: manual runs only; file arrival never fired here (no file events on the shared external location)
        file_arrival:
          # The generator writes landing/drops/DROP_COMPLETE_<date>.json LAST, after every source folder
          # of the drop has its _MANIFEST.json, so a run starts only when a whole drop is complete.
          url: /Volumes/${var.catalog}/${var.schema}/landing/drops/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: setup_governance
          description: "T0: personas, entitlements, row-filter and mask functions, schema tags (idempotent)"
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/governance.sql
        - task_key: refresh_pipeline
          description: "T1: incremental update of the Lakeflow pipeline"
          depends_on:
            - task_key: setup_governance
          pipeline_task:
            pipeline_id: ${resources.pipelines.febar_pipeline.id}
        - task_key: settle_pipeline
          description: "T1a: second pipeline update. In run 321182104220187 a materialized view (silver_auth) refreshed before its input (silver_issuer_auth) had committed, so gold lagged one drop. This update has nothing new to ingest and recomputes the views from committed inputs; evidence_snapshot checks freshness."
          depends_on:
            - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.febar_pipeline.id}
        - task_key: apply_tags
          description: "T1b: tags on pipeline-owned tables (they must exist first)"
          depends_on:
            - task_key: settle_pipeline
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/governance_tags.sql
        - task_key: explain_anomalies
          description: "T2: flag anomalies (frozen threshold) and explain each case's top flag with ai_query"
          depends_on:
            - task_key: apply_tags
          notebook_task:
            notebook_path: ../src/ai/explain_anomalies.py
            base_parameters:
              llm_endpoint: ${var.llm_endpoint}
              prompt_version: v3
              top_n: "60"
              representatives_only: "true"
        - task_key: sync_cases
          description: "T3: upsert cases into Lakebase ops.cases (machine columns only; human edits survive), history events"
          depends_on:
            - task_key: explain_anomalies
          notebook_task:
            notebook_path: ../src/serve/sync_cases.py
            base_parameters:
              prompt_version: v3
        - task_key: sync_cases_back
          description: "T4: Lakebase ops.cases -> UC gold_case_status (row filter by persona)"
          depends_on:
            - task_key: sync_cases
          notebook_task:
            notebook_path: ../src/serve/sync_cases_back.py
        - task_key: wave_readiness
          description: "T5: wave readiness gate (GO only if segment gap <= 0.3 pp and no open HIGH case) + at-risk volume"
          depends_on:
            - task_key: sync_cases_back
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/serve/wave_readiness.sql
        - task_key: evidence_snapshot
          description: "T6: cross-check the same numbers across gold (UC), Lakebase and readiness; exit value = the snapshot"
          depends_on:
            - task_key: wave_readiness
          notebook_task:
            notebook_path: ../src/serve/evidence_snapshot.py
