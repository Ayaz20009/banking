resources:
  jobs:
    febar_ai:
      name: febar_ai
      description: "Intelligent step: tune+freeze threshold (tuning days only) -> flag + explain top N (ai_query) -> evaluate (EVAL_PROTOCOL v1+A1+A2)"
      max_concurrent_runs: 1
      parameters:
        - name: prompt_version
          default: v1
        - name: run_label
          default: eval_v1
        - name: parts
          default: "detection,genai"
        - name: top_n
          default: "60"
        - name: only_keys_from_run
          default: ""
        - name: same_keys_as_run
          default: ""
      tasks:
        - task_key: tune_threshold
          notebook_task:
            notebook_path: ../src/ai/tune_threshold.py
        - task_key: explain_anomalies
          depends_on:
            - task_key: tune_threshold
          notebook_task:
            notebook_path: ../src/ai/explain_anomalies.py
            base_parameters:
              llm_endpoint: ${var.llm_endpoint}
              prompt_version: "{{job.parameters.prompt_version}}"
              top_n: "{{job.parameters.top_n}}"
              only_keys_from_run: "{{job.parameters.only_keys_from_run}}"
        - task_key: evaluate
          depends_on:
            - task_key: explain_anomalies
          notebook_task:
            notebook_path: ../src/ai/evaluate.py
            base_parameters:
              judge_endpoint: ${var.judge_endpoint}
              prompt_version: "{{job.parameters.prompt_version}}"
              run_label: "{{job.parameters.run_label}}"
              parts: "{{job.parameters.parts}}"
              same_keys_as_run: "{{job.parameters.same_keys_as_run}}"
